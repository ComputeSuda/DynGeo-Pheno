name: DynGeo-Pheno
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  # ---------- Python ----------
  - python=3.10

  # ---------- Core deep learning stack ----------
  - pytorch>=2.0            # adjust CUDA build via pytorch channel (e.g. pytorch-cuda=12.1)
  - torchvision
  - torchaudio
  - pyg>=2.4                # PyTorch Geometric (torch_geometric)

  # ---------- Scientific computing ----------
  - numpy>=1.24,<2.0        # pin <2.0 for torch_geometric / scipy compat
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3

  # ---------- I/O & progress ----------
  - tqdm
  - openpyxl                # Excel benchmark table reading (pd.read_excel)
  - xlrd                    # legacy .xls support (optional)

  # ---------- Structural biology (external spectral cache generation) ----------
  - prody>=2.4              # ANM/GNM eigendecomposition used to build Raw_Spectral_Cache

  # ---------- Protein language model (external ESM embedding extraction) ----------
  - pip
  - pip:
      - fair-esm==2.0.0     # ESM-2 embeddings -> ESM_128d / ESM_128d_mut (frozen PCA)
